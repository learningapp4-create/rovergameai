  const wheelGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.16, 14);

}
{

}
const motes = [];
{
  const geo = new THREE.SphereGeometry(0.03, 4, 3);
  const mat = new THREE.MeshBasicMaterial({ color: 0xc5ced6, transparent: true, opacity: 0.25 });
  for (let i = 0; i < 36; i++) {

}
{
  const rock = new THREE.DodecahedronGeometry(0.4, 0);

  for (let i = 0; i < 34; i++) {

const roverMesh = buildRover();

  const c = cellCenter(b.i);
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 2.2, 6), new THREE.MeshStandardMaterial({ color: 0xe8e3d8, metalness: 0.5, roughness: 0.35 }));
  pole.position.y = 1.1; pole.castShadow = true; g.add(pole);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), new THREE.MeshBasicMaterial({ color: 0xf2d48a }));
  bulb.position.y = 2.25; g.add(bulb);
  g.position.set(c.x, heightAt(c.x, c.z), c.z);

});
const groundMarks = new Map();
function ensureMark(i, color, radius) {
  if (groundMarks.has(i)) return;
  const c = cellCenter(i);
  const m = new THREE.Mesh(
    new THREE.CircleGeometry(radius, 20),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.62, depthWrite: false, side: THREE.DoubleSide })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(c.x, heightAt(c.x, c.z) + 0.1, c.z);

}
function plantMarkFlag(i, color) {
  const c = cellCenter(i);
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 1.5, 6), new THREE.MeshStandardMaterial({ color: 0xf4f7fb, metalness: 0.4 }));
  pole.position.y = 0.75;
  pole.castShadow = true;
  const flag = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.26, 0.03), new THREE.MeshBasicMaterial({ color }));
  flag.position.set(0.24, 1.25, 0);

  g.position.set(c.x, heightAt(c.x, c.z), c.z);

}

function sense() {
  for (let i = 0; i < cells.length; i++) {
    const c = cellCenter(i);
    if (Math.hypot(c.x - rover.x, c.z - rover.z) <= 7) obs[mode][i] = reading(cells[i], mode);
  }
}
function setMode(next) {
  if (phase !== "play") return;
  mode = next;
  for (const name of ["relief", "thermal", "mineral", "ice"]) {
    $("b-" + name).setAttribute("aria-pressed", name === mode ? "true" : "false");
  }
  viewEl.className = mode;
  const labels = { relief: "RELIEF", thermal: "THERMAL", mineral: "MINERAL", ice: "ICE RADAR" };
  $("viewTag").textContent = labels[mode] + " VISOR";
  $("modeLabel").textContent = labels[mode];
}
function markFlag(type) {
  if (phase !== "play") return;
  const i = cellAt(rover.x, rover.z);
  const c = cells[i];
  const ok = type === "water" ? c.water : type === "mineral" ? c.mineralHot : false;
  if (!ok) {
    rejectedCell = i;
    flash(type === "water" ? "That mark was not water." : "That mark was not a vein.", "fail");
    return;
  }
  rejectedCell = -1;
  const existing = flags.find((f) => f.i === i);
  if (existing) existing.type = type;
  else if (flags.length < 9) flags.push({ i, type });
  plantMarkFlag(i, type === "water" ? 0x7ecbff : 0xc084fc);
  ensureMark(i, type === "water" ? 0xd7f6ff : 0xe7c6ff, type === "water" ? 1.8 : 1.4);
}
function logTemp() {
  if (phase !== "play") return;
  const i = cellAt(rover.x, rover.z);
  const b = beacons.find((item) => item.i === i);
  if (!b) { say("Stand on a beacon mast to log temperature."); return; }
  if (mode !== "thermal") { say("Thermal layer has to be active to log the mast."); return; }
  if (b.logged) { say(b.name + " is already on the temperature map."); return; }
  b.logged = true;
  say(b.name + " logged as " + words("thermal", cells[i].temp) + ".");
}
function nextAction() {
  const label = $("end").textContent;
  if (label === "Retry" || phase !== "play") { location.reload(); return; }
  if (label === "Ice radar") setMode("ice");
  else if (label === "Vein layer") setMode("mineral");
  else if (label === "Mark water") markFlag("water");
  else if (label === "Mark vein") markFlag("mineral");
}
function step(dt) {
  if (!live || phase !== "play") { rover.speed = 0; return; }
  let turn = 0;
  if (keys["a"] || keys["arrowleft"]) turn += 1;
  if (keys["d"] || keys["arrowright"]) turn -= 1;
  if (keys["w"] || keys["arrowup"]) throttle = Math.min(1, throttle + dt * 1.8);
  else if (keys["s"] || keys["arrowdown"]) throttle = Math.max(-0.45, throttle - dt * 1.8);
  else if (!goal) throttle *= Math.pow(0.05, dt);
  if (goal) {
    const dx = goal.x - rover.x, dz = goal.z - rover.z;
    if (Math.hypot(dx, dz) < 1.3) { goal = null; throttle = 0; }
    else {
      const desired = Math.atan2(dx, dz);
      turn += clamp(normAng(desired - rover.yaw) * 1.4, -1, 1);
      throttle = Math.min(1, throttle + dt * 1.6);
    }
  }
  rover.yaw += turn * 1.7 * dt;
  rover.speed = throttle * 12;
  rover.x = clamp(rover.x + Math.sin(rover.yaw) * rover.speed * dt, -HALF + 1, HALF - 1);
  rover.z = clamp(rover.z + Math.cos(rover.yaw) * rover.speed * dt, -HALF + 1, HALF - 1);
  const moving = Math.abs(rover.speed) > 0.4;
  energy -= (moving ? 1.05 : 0.12) * dt;
  if (energy <= 0) {
    energy = 0;
    phase = "done";
    goal = null;
    const s = gradedScore();
    const { wOk } = markCounts();
    if (s >= 90) flash("Strong", "great");
    else if (s >= 60) flash("The last pockets are still dark.", "fail");
    else flash(wOk < 2 ? "Missed the water." : "Missed the vein.", "fail");
    return;
  }
  if (goal && brightHere()) { goal = null; throttle = 0; rover.speed = 0; }
  sense();
  const here = obs[mode][cellAt(rover.x, rover.z)];
  $("words").textContent = words(mode, here);
}

const map = $("map");
const ctx = map.getContext("2d");
function worldToMap(x, z, w, h) { return { px: (x / WORLD + 0.5) * w, py: (z / WORLD + 0.5) * h }; }
function hexLerp(a, b, t) {
  const pa = [(a >> 16) & 255, (a >> 8) & 255, a & 255];
  const pb = [(b >> 16) & 255, (b >> 8) & 255, b & 255];
  const c = pa.map((v, i) => Math.round(lerp(v, pb[i], clamp(t, 0, 1))));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function cellFill(v) {
  if (mode === "thermal") return v < 0.5 ? hexLerp(0x1d4e89, 0x6b3a6a, v / 0.5) : hexLerp(0x6b3a6a, 0xe23d3d, (v - 0.5) / 0.5);
  if (mode === "mineral") return hexLerp(0x1a1024, 0xe879f9, v);
  if (mode === "ice") return hexLerp(0x102028, 0x67e8f9, v);
  return hexLerp(0x1c2430, 0xf4f7fb, v);
}
function drawMap() {
  const w = map.clientWidth, h = map.clientHeight;
  if (w < 2 || h < 2) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if (map.width !== Math.floor(w * dpr) || map.height !== Math.floor(h * dpr)) {
    map.width = Math.floor(w * dpr); map.height = Math.floor(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0e131b";
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < cells.length; i++) {
    const c = cellCenter(i);
    const p = worldToMap(c.x, c.z, w, h);
    const cw = (CELL / WORLD) * w, ch = (CELL / WORLD) * h;
    const v = obs[mode][i];
    ctx.fillStyle = v == null ? "#121820" : cellFill(v);
    ctx.fillRect(p.px - cw / 2 + 1, p.py - ch / 2 + 1, cw - 2, ch - 2);
  }
  for (const b of beacons) {
    const c = cellCenter(b.i);
    const p = worldToMap(c.x, c.z, w, h);
    ctx.save();
    ctx.translate(p.px, p.py);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = b.logged ? "#f0c14a" : "#f4efe2";
    ctx.fillRect(-5, -5, 10, 10);
    ctx.restore();
  }
  for (const f of flags) {
    const c = cellCenter(f.i);
    const p = worldToMap(c.x, c.z, w, h);
    ctx.fillStyle = f.type === "water" ? "#7ec8e3" : f.type === "mineral" ? "#e879f9" : "#f4f7fb";
    ctx.beginPath();
    ctx.arc(p.px, p.py, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#14181f";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(f.type === "water" ? "W" : f.type === "mineral" ? "M" : "H", p.px, p.py);
  }
  if (goal) {
    const p = worldToMap(goal.x, goal.z, w, h);
    ctx.strokeStyle = "#f4efe2";
    ctx.strokeRect(p.px - 6, p.py - 6, 12, 12);
  }
  const rp = worldToMap(rover.x, rover.z, w, h);
  ctx.save();
  ctx.translate(rp.px, rp.py);
  ctx.rotate(rover.yaw);
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.moveTo(0, 10); ctx.lineTo(7, -8); ctx.lineTo(-7, -8); ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}
map.addEventListener("pointerdown", (ev) => {
  if (!live || phase !== "play") return;
  const r = map.getBoundingClientRect();
  const mx = (ev.clientX - r.left) / r.width;
  const my = (ev.clientY - r.top) / r.height;
  goal = { x: clamp((mx - 0.5) * WORLD, -HALF + 2, HALF - 2), z: clamp((my - 0.5) * WORLD, -HALF + 2, HALF - 2) };
});
$("b-relief").onclick = () => setMode("relief");
$("b-thermal").onclick = () => setMode("thermal");
$("b-mineral").onclick = () => setMode("mineral");
$("b-ice").onclick = () => setMode("ice");
$("end").onclick = nextAction;
$("restart").onclick = () => location.reload();
$("begin").onclick = () => { live = true; $("brief").hidden = true; setMode("ice"); };
window.addEventListener("keydown", (e) => {
  if (!live) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (k === "1") setMode("relief");
  else if (k === "2") setMode("thermal");
  else if (k === "3") setMode("mineral");
  else if (k === "4") setMode("ice");
  else if (k === "z") markFlag("water");
  else if (k === "x") markFlag("mineral");
  else if (k === "c") markFlag("hazard");
  else if (k === "t") logTemp();
  else if (k === "enter") nextAction();
  else if (k === "r") location.reload();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

const camPos = new THREE.Vector3();
const look = new THREE.Vector3();
let last = performance.now();
let trackClock = 0;
const tracks = [];
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  step(dt);
  const y = heightAt(rover.x, rover.z);
  roverMesh.position.set(rover.x, y, rover.z);
  roverMesh.rotation.y = rover.yaw;
  for (const w of roverMesh.userData.wheels) w.rotation.x += rover.speed * dt * 2.2;
  const k = 1 - Math.exp(-dt * 2.4);
  look.lerp(new THREE.Vector3(rover.x + Math.sin(rover.yaw) * 2, y + 0.6, rover.z + Math.cos(rover.yaw) * 2), k);
  camPos.lerp(new THREE.Vector3(rover.x - Math.sin(rover.yaw) * 13, y + 8.4, rover.z - Math.cos(rover.yaw) * 13), k);
  camera.position.copy(camPos);
  camera.lookAt(look);
  sun.target.position.set(rover.x, y, rover.z);
  for (const m of motes) { m.position.x += m.userData.s * dt; if (m.position.x > 26) m.position.x = -26; }
  for (let i = 0; i < cells.length; i++) {
    if (obs.ice[i] != null && obs.ice[i] >= 0.62 && cells[i].water) ensureMark(i, 0xd7f6ff, 1.7);
    if (obs.mineral[i] != null && obs.mineral[i] >= 0.55 && cells[i].mineralHot) ensureMark(i, 0xc084fc, 1.35);
  }
  beaconMeshes.forEach((g, n) => {
    const bulb = g.children[1];
    if (bulb && beacons[n] && beacons[n].logged) bulb.material.color.setHex(0x7dffb3);
  });
  trackClock += dt;
  if (Math.abs(rover.speed) > 1.2 && trackClock > 0.35) {
    trackClock = 0;
    const m = new THREE.Mesh(
      new THREE.CircleGeometry(0.16, 6),
      new THREE.MeshBasicMaterial({ color: 0x141820, transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide })
    );
    m.rotation.x = -Math.PI / 2;
    m.position.set(rover.x, y + 0.04, rover.z);
    scene.add(m);
    tracks.push(m);
    if (tracks.length > 48) scene.remove(tracks.shift());
  }
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  if (w > 0 && h > 0 && camera.aspect !== w / h) {
    camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h, false);
  }
  renderer.render(scene, camera);

  paintScore();
  requestAnimationFrame(frame);
}
sense();

requestAnimationFrame(frame);
window.ROVER = {
