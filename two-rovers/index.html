<!DOCTYPE html>

<title>Dual Link — Moon Rover</title>

</head>

const lunaMesh = buildRover(0x2ee6d6);

{

{

const MAP_W = 84, MAP_H = 64;
const map = $("map");
const ctx = map.getContext("2d");
function worldToMap(x, z, w, h) {
  return { px: ((x + 42) / MAP_W) * w, py: ((z + 32) / MAP_H) * h };
}
function drawZone(x, z, radius, color, w, h) {
  const p = worldToMap(x, z, w, h);
  ctx.save();
  ctx.translate(p.px, p.py);
  ctx.scale(w / MAP_W, h / MAP_H);
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = MAP_W / w * 1.5;
  ctx.stroke();
  ctx.restore();
}
function drawIcon(x, y, yaw, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(yaw);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 9); ctx.lineTo(6, -7); ctx.lineTo(-6, -7); ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawMap() {
  const w = map.clientWidth, h = map.clientHeight;
  if (w < 2 || h < 2) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if (map.width !== Math.floor(w * dpr) || map.height !== Math.floor(h * dpr)) {
    map.width = Math.floor(w * dpr); map.height = Math.floor(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#1a1024";
  ctx.fillRect(0, 0, w, h);
  const ridge = worldToMap(-3.4, -24, w, h);
  const ridge2 = worldToMap(3.4, 8, w, h);
  ctx.fillStyle = "#3a2450";
  ctx.fillRect(ridge.px, ridge.py, ridge2.px - ridge.px, ridge2.py - ridge.py);
  ctx.fillStyle = "#243044";
  const gapA = worldToMap(-5, 8, w, h);
  const gapB = worldToMap(5, 20, w, h);
  ctx.fillRect(gapA.px, gapA.py, gapB.px - gapA.px, gapB.py - gapA.py);
  drawZone(depot.x, depot.z, 6, "#f0c14a", w, h);
  const dp = worldToMap(depot.x, depot.z, w, h);
  ctx.fillStyle = "#f0c14a";
  ctx.fillRect(dp.px - 4, dp.py - 4, 8, 8);
  const showProbe = probeKnown || handshakeDone || (activeName === "MARE" && Math.hypot(mare.x - probe.x, mare.z - probe.z) < 26);
  if (probeKnown || handshakeDone) {
    drawZone(probe.x, probe.z, 6, "#ff6b8a", w, h);
    const pp = worldToMap(probe.x, probe.z, w, h);
    ctx.fillStyle = "#ff6b8a";
    ctx.beginPath(); ctx.arc(pp.px, pp.py, 5, 0, Math.PI * 2); ctx.fill();
  } else if (activeName === "MARE") {
    drawZone(probeGuess.x, probeGuess.z, 12, "rgba(255,107,138,0.8)", w, h);
    if (showProbe) {
      const from = worldToMap(mare.x, mare.z, w, h);
      const ang = Math.atan2(probe.x - mare.x, probe.z - mare.z);
      ctx.strokeStyle = "rgba(255,107,138,0.55)";
      ctx.beginPath();
      ctx.moveTo(from.px, from.py);
      ctx.lineTo(from.px + Math.sin(ang) * 46, from.py + Math.cos(ang) * 46);
      ctx.stroke();
    }
  }
  for (const r of [luna, mare]) {
    if (r.pending) {
      const a = worldToMap(r.x, r.z, w, h);
      const b = worldToMap(r.pending.x, r.pending.z, w, h);
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = r.name === "LUNA" ? "#2ee6d6" : "#ff8a3d";
      ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
      ctx.setLineDash([]);
    } else if (r.hasTarget) {
      const a = worldToMap(r.x, r.z, w, h);
      const b = worldToMap(r.tx, r.tz, w, h);
      ctx.strokeStyle = r.name === "LUNA" ? "#2ee6d6" : "#ff8a3d";
      ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
    }
  }
  const delay = linkDelay();
  const me = active();
  const ghost = sampleHist(other(), now - delay);
  const meP = worldToMap(me.x, me.z, w, h);
  const ghP = worldToMap(ghost.x, ghost.z, w, h);
  drawIcon(ghP.px, ghP.py, ghost.yaw, other().name === "LUNA" ? "rgba(46,230,214,0.45)" : "rgba(255,138,61,0.45)");
  drawIcon(meP.px, meP.py, me.yaw, me.name === "LUNA" ? "#2ee6d6" : "#ff8a3d");
  ctx.fillStyle = "#f6efe6";
  ctx.font = "12px sans-serif";
  ctx.fillText(delay < 0.5 ? "LINK LIVE" : "LINK " + delay.toFixed(1) + "s STALE", 8, 16);
}
map.addEventListener("pointerdown", (ev) => {
  if (!live || phase !== "play") return;
  const rect = map.getBoundingClientRect();
  const mx = (ev.clientX - rect.left) / rect.width;
  const my = (ev.clientY - rect.top) / rect.height;
  const x = mx * MAP_W - 42;
  const z = my * MAP_H - 32;
  const delay = linkDelay();
  const ghost = sampleHist(other(), now - delay);

  command(active(), x, z);
});
$("card-luna").onclick = () => selectRover("LUNA");
$("card-mare").onclick = () => selectRover("MARE");

    if (cargoDone && rescueDone && !linkGoal) {

renderer.domElement.addEventListener("pointerdown", (ev) => {
  if (!live || phase !== "play") return;
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);

  let point = hit ? hit.point : null;
  if (!point) {

});
window.addEventListener("keydown", (e) => {

  else if (e.key === "h" || e.key === "H") meetup();
  else if (e.key === "Enter") { const go = $("go"); if (go && !go.hidden) go.click(); }
  else if (e.key === "r" || e.key === "R") location.reload();

function placeMesh(mesh, r, ghosted) {
  const pose = ghosted ? sampleHist(r, now - linkDelay()) : r;
  mesh.position.set(pose.x, heightAt(pose.x, pose.z), pose.z);
  mesh.rotation.y = pose.yaw;
  mesh.traverse((obj) => {
    if (obj.material && obj.material.transparent !== undefined && obj !== probeMesh) {
      obj.material.opacity = ghosted && linkDelay() > 0.6 ? 0.4 : 1;
      obj.material.transparent = true;
    }
  });
  for (const w of mesh.userData.wheels) w.rotation.x += r.speed * 0.016;
}
const camPos = new THREE.Vector3(luna.x - 12, 16, luna.z - 12);
const look = new THREE.Vector3();
let last = performance.now();
function frame(t) {
  const dt = clamp((t - last) / 1000, 0, 0.05);
  last = t;
  step(dt);
  probeMesh.visible = true;
  placeMesh(lunaMesh, luna, activeName !== "LUNA");
  placeMesh(mareMesh, mare, activeName !== "MARE");
  if (cargoDone && cargoBox.parent === lunaMesh) scene.attach(cargoBox);
  if (cargoDone) {
    cargoBox.position.set(depot.x, heightAt(depot.x, depot.z) + 0.42, depot.z);
    depotLamp.intensity = 10;
    depotMast.material.emissiveIntensity = 1.4;
    depotMesh.material.emissive.setHex(0xf0c14a);
  }
  const blink = 0.55 + Math.sin(now * 4) * 0.45;
  probeLamp.intensity = rescueDone ? 7 : blink * 1.4;
  probeBeacon.material.color.setHex(rescueDone ? 0xb7fff2 : 0xff6b8a);
  if (rescueDone) probeMesh.rotation.z = 0.15;
  const linked = sees(luna, mare);
  linkLine.material.opacity = linked ? (handshakeDone ? 0.95 : 0.28) : 0;
  linkLine.geometry.setFromPoints([
    new THREE.Vector3(lunaMesh.position.x, lunaMesh.position.y + 1.45, lunaMesh.position.z),
    new THREE.Vector3(mareMesh.position.x, mareMesh.position.y + 1.45, mareMesh.position.z)
  ]);
  const dusk = 1 - clamp(timeLeft / 150, 0, 1);
  sun.intensity = 4.3 * (1 - dusk * 0.7);
  scene.fog.density = 0.016 + dusk * 0.022;
  const me = active();
  const y = heightAt(me.x, me.z);
  const k = 1 - Math.exp(-dt * 2.2);
  look.lerp(new THREE.Vector3(me.x + Math.sin(me.yaw) * 2, y + 0.7, me.z + Math.cos(me.yaw) * 2), k);
  camPos.lerp(new THREE.Vector3(me.x - Math.sin(me.yaw) * 15, y + 9.2, me.z - Math.cos(me.yaw) * 15), k);
  camera.position.copy(camPos);
  camera.lookAt(look);
  sun.target.position.set(me.x, y, me.z);
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  if (w > 0 && h > 0 && camera.aspect !== w / h) {

  }

  drawMap();
  paintScore();
  requestAnimationFrame(frame);
}
