</head>

  rover.z = clamp(rover.z + Math.cos(rover.yaw) * speed * dt, -46, 46);
  const moving = Math.abs(speed) > 0.3;
  const sunlit = !dusty && (bask || heightAt(rover.x, rover.z) > -0.15);
  if (moving) power -= 8.2 * dt;
  else power -= 0.35 * dt;
  if (sunlit) power += (moving ? 0.8 : 4.6) * dt;
  if (keys["f"] && !rescueDone && Math.hypot(rover.x - stranded.x, rover.z - stranded.z) < 5) {
    power -= 2 * dt;
    rescueHold += dt;
    if (rescueHold > 1.35) rescueDone = true;
  } else rescueHold = 0;
  power = clamp(power, 0, 100);
  bestCargo = Math.min(bestCargo, Math.hypot(rover.x - cache.x, rover.z - cache.z));
  bestRescue = Math.min(bestRescue, Math.hypot(rover.x - stranded.x, rover.z - stranded.z));
  if (crumbs.length === 0 || Math.hypot(crumbs[crumbs.length - 1].x - rover.x, crumbs[crumbs.length - 1].z - rover.z) > 1.2) {
    crumbs.push({ x: rover.x, z: rover.z });
  }
  const sense = reading();
  if (!dusty && sense.strength > 0.35) {
    const abs = rover.yaw + sense.bearing;
    const distEst = (1 - sense.strength) * 34;
    est[mode] = {
      x: rover.x + Math.sin(abs) * distEst,
      z: rover.z + Math.cos(abs) * distEst,
      err: 3 + (1 - sense.strength) * 8
    };
  }
  cacheMesh.visible = Math.hypot(rover.x - cache.x, rover.z - cache.z) < 12;
  strandedMesh.visible = Math.hypot(rover.x - stranded.x, rover.z - stranded.z) < 12;
  scene.fog.density = dusty ? 0.08 : 0.014;
  dustCloud.visible = dusty;
  if (dusty) dustCloud.position.set(rover.x, 0, rover.z);
  if (power <= 0) { power = 0; endRun(); return; }
  if (timeLeft <= 0) endRun();
  if (dusty && sense.strength < 0.15) {
    /* keep the last status if a more specific message is up */
  }
}
function deliver() {
  if (phase !== "play" || cargoDone) return;
  if (!nearCache()) return;
  cargoDone = true;
  cruise = null;
  power = Math.max(0, power - 4);
}
function setMode(next) { mode = next; hold = null; }
function seek(which) {
  if (phase !== "play") return;
  bask = false;
  setMode(which === "rover" ? "radio" : "thermal");
  cruise = which === "rover" ? "rover" : "cache";
  const sense = reading();
  if (sense.strength >= 0.08) hold = rover.yaw + sense.bearing;
}
function doAction() {
  const label = $("go").textContent;
  if (label === "Seek cache") seek("cache");
  else if (label === "Drop cargo") deliver();
  else if (label === "Seek rover") seek("rover");
  else if (label === "Rescue") { if (nearRover()) rescueDone = true; cruise = null; }
  else if (label === "Bask") { bask = true; cruise = null; hold = null; }
  else if (label === "Retry") location.reload();
}
function captureHold() {
  const sense = reading();
  if (sense.dusty || sense.strength < 0.2) return;
  hold = rover.yaw + sense.bearing;
}

const map = $("map");
const ctx = map.getContext("2d");
const WORLD = 100;
function worldToMap(x, z, w, h) { return { px: (x / WORLD + 0.5) * w, py: (z / WORLD + 0.5) * h }; }
function drawMap() {
  const w = map.clientWidth, h = map.clientHeight;
  if (w < 2 || h < 2) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if (map.width !== Math.floor(w * dpr) || map.height !== Math.floor(h * dpr)) {
    map.width = Math.floor(w * dpr); map.height = Math.floor(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#2a1d14";
  ctx.fillRect(0, 0, w, h);
  for (const b of bands) {
    const cx = dustCenter(b, time);
    const a = worldToMap(cx - b.width / 2, b.z0, w, h);
    const c = worldToMap(cx + b.width / 2, b.z1, w, h);
    ctx.fillStyle = "rgba(196,165,116,0.35)";
    ctx.fillRect(a.px, a.py, c.px - a.px, c.py - a.py);
  }
  ctx.strokeStyle = "#e7d3b0";
  ctx.beginPath();
  crumbs.forEach((p, i) => {
    const q = worldToMap(p.x, p.z, w, h);
    if (i === 0) ctx.moveTo(q.px, q.py); else ctx.lineTo(q.px, q.py);
  });
  ctx.stroke();
  for (const key of ["thermal", "radio"]) {
    const e = est[key];
    if (!e) continue;
    const p = worldToMap(e.x, e.z, w, h);
    ctx.strokeStyle = key === "thermal" ? "#ffb703" : "#9ad7ff";
    ctx.beginPath();
    ctx.arc(p.px, p.py, (e.err / WORLD) * w, 0, Math.PI * 2);
    ctx.stroke();
  }
  const rp = worldToMap(rover.x, rover.z, w, h);
  ctx.save();
  ctx.translate(rp.px, rp.py); ctx.rotate(rover.yaw); ctx.fillStyle = "#fff6e8";
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(5, -6); ctx.lineTo(-5, -6); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawNeedle() {
  const c = $("needle");
  const g = c.getContext("2d");
  const sense = reading();
  g.clearRect(0, 0, 120, 120);
  g.fillStyle = "#2a1c12";
  g.beginPath(); g.arc(60, 60, 58, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "#c4a574";
  g.stroke();
  g.fillStyle = "#c4a574";
  g.font = "11px sans-serif";
  g.textAlign = "center";
  g.fillText(sense.strength < 0.08 ? "NO FIX" : sense.dusty ? "DUST" : "SIGNAL", 60, 78);
  g.save();
  g.translate(60, 60);
  g.rotate(sense.strength < 0.08 ? 0 : sense.bearing);
  g.strokeStyle = sense.dusty ? "#e85d04" : "#ffb703";
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, 10); g.lineTo(0, -40); g.stroke();
  g.restore();
  g.fillStyle = "#fff6e8";
  g.beginPath(); g.arc(60, 60, 4, 0, Math.PI * 2); g.fill();
}

$("b-thermal").onclick = () => seek("cache");
$("b-radio").onclick = () => seek("rover");
$("go").onclick = doAction;
$("restart").onclick = () => location.reload();
$("begin").onclick = () => { live = true; $("brief").hidden = true; seek("cache"); };
window.addEventListener("keydown", (e) => {
  if (!live) return;
  keys[e.key.toLowerCase()] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key === "1") setMode("thermal");
  if (e.key === "2") setMode("radio");
  if (e.key === "e" || e.key === "E") deliver();
  if (e.key === "n" || e.key === "N") captureHold();
  if (e.key === "Enter") doAction();
  if (e.key === "r" || e.key === "R") location.reload();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

const camPos = new THREE.Vector3();
const look = new THREE.Vector3();
let last = performance.now();
function frame(t) {
  const dt = clamp((t - last) / 1000, 0, 0.05);
  last = t;
  step(dt);
  const y = heightAt(rover.x, rover.z);
  roverMesh.position.set(rover.x, y, rover.z);
  roverMesh.rotation.y = rover.yaw;
  for (const w of roverMesh.userData.wheels) w.rotation.x += rover.speed * dt * 2;
  const k = 1 - Math.exp(-dt * 2.3);
  look.lerp(new THREE.Vector3(rover.x + Math.sin(rover.yaw) * 2.2, y + 0.6, rover.z + Math.cos(rover.yaw) * 2.2), k);
  camPos.lerp(new THREE.Vector3(rover.x - Math.sin(rover.yaw) * 14, y + 8.2, rover.z - Math.cos(rover.yaw) * 14), k);
  camera.position.copy(camPos);
  camera.lookAt(look);
  sun.target.position.set(rover.x, y, rover.z);
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  if (w > 0 && h > 0 && camera.aspect !== w / h) {
    camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h, false);
  }
  renderer.render(scene, camera);
  drawMap();
  drawNeedle();
  paintScore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.ROVER = {
  rover, cache, stranded, liveScore, finalScore, deliver, reading,
  get power() { return power; },
  get cargoDone() { return cargoDone; },
  get rescueDone() { return rescueDone; },
  get phase() { return phase; },
  teleport(x, z) { rover.x = x; rover.z = z; }
};
</script>
</body>
