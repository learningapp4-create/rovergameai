  ctx.fillStyle = "#2a2318";
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "#8a7a5e";
  ctx.strokeRect(8, 8, w - 16, h - 16);
  ctx.fillStyle = "#f3ead7";
  ctx.font = "12px sans-serif";
  ctx.fillText("N", w / 2 - 4, 18);
  for (const v of visited) {
    const p = worldToMap(v.x, v.z, w, h);
    ctx.fillStyle = "#e6b35a";
    ctx.fillRect(p.px - 3, p.py - 3, 6, 6);
  }
  if (proposal && phase === "choose") {
    const p = worldToMap(proposal.dest.x, proposal.dest.z, w, h);
    const r = worldToMap(rover.x, rover.z, w, h);
    ctx.strokeStyle = "#1c160f";
    ctx.beginPath(); ctx.moveTo(r.px, r.py); ctx.lineTo(p.px, p.py); ctx.stroke();
    ctx.fillStyle = "#1c160f";
    ctx.beginPath(); ctx.arc(p.px, p.py, 4, 0, Math.PI * 2); ctx.fill();
  }
  const rp = worldToMap(rover.x, rover.z, w, h);
  ctx.save();
  ctx.translate(rp.px, rp.py);
  ctx.rotate(rover.yaw);
  ctx.fillStyle = "#fffaf0";
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(5, -6); ctx.lineTo(-5, -6); ctx.closePath(); ctx.fill();
  ctx.restore();
}
map.addEventListener("pointerdown", (ev) => {
  if (!mapOverride || phase !== "choose") return;
  const rect = map.getBoundingClientRect();
  const mx = (ev.clientX - rect.left) / rect.width;
  const my = (ev.clientY - rect.top) / rect.height;
  overridePoint = { x: (mx - 0.5) * 90, z: (my - 0.5) * 90 };
  const picked = document.getElementById("picked");
  if (picked) picked.textContent = "Map point set. Press Go.";
});

const camPos = new THREE.Vector3(8, 10, 12);
const look = new THREE.Vector3();
let last = performance.now();
function frame(t) {
  const dt = clamp((t - last) / 1000, 0, 0.05);
  last = t;
  if (phase === "move" && move) {
    move.t += dt / 1.15;
    const k = clamp(move.t, 0, 1);
    rover.x = lerp(move.x, move.dest.x, k);
    rover.z = lerp(move.z, move.dest.z, k);
    if (k >= 1) finishMove();
  }
  const y = heightAt(rover.x, rover.z);
  roverMesh.position.set(rover.x, y, rover.z);
  roverMesh.rotation.y = rover.yaw;
  const follow = phase === "move" ? 1 : 0.4;
  look.lerp(new THREE.Vector3(rover.x, y + 0.6, rover.z), 1 - Math.exp(-dt * 2));
  camPos.lerp(new THREE.Vector3(rover.x - Math.sin(rover.yaw) * (12 - follow), y + 7, rover.z - Math.cos(rover.yaw) * (12 - follow)), 1 - Math.exp(-dt * 2));
  camera.position.copy(camPos);
  camera.lookAt(look);
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  if (w > 0 && h > 0 && camera.aspect !== w / h) {
    camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h, false);
  }
  renderer.render(scene, camera);
  drawMap();
  requestAnimationFrame(frame);
}
proposal = makeProposal();
renderChoose();
paintScore();
requestAnimationFrame(frame);
window.addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") location.reload();
  if (phase !== "choose" || !proposal) return;
  if (e.key === "Enter") launch(proposal.dest, proposal.action);
  if (e.key === "e" || e.key === "E") renderEdit();
  if (e.key === "o" || e.key === "O") renderOverride();
});
window.ROVER = {
  get score() { return score; },
  get phase() { return phase; },
  get turn() { return turn; },
  features, rover, launch,
  accept() { if (proposal) launch(proposal.dest, proposal.action); },
  scanAhead() {
    const open = features.filter((f) => !f.done && f.kind !== "hazard").sort((a, b) => dist(rover, a) - dist(rover, b))[0];
    if (open) launch(open, "scan");
  }
};
</script>
