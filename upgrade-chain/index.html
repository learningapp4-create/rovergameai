<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Ladder — Moon Rover</title>
<style>

  #mapPane { border-top: 1px solid var(--line); position: relative; min-height: 0; }

  #status { color: var(--amber); min-height: 2.6em; }

  #banner {

  }
  #banner.pass { color: var(--good); }
  #banner.great { color: var(--amber); }
  #banner.fail { color: #ff8f8f; }
  .boot-error { padding: 12px; }
  .group-label { margin: 8px 0 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  button.primary { background: var(--good); color: #06210c; border-color: var(--good); font-weight: 750; width: 100%; }
  .brief { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; background: rgba(2, 10, 6, 0.7); }
  .brief[hidden] { display: none; }
  .brief-card { width: min(440px, 100%); background: #062014; color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }

  .brief-card li { margin: 8px 0; }
  .brief-card .primary { width: 100%; padding: 12px; }
  .brief-card p { margin: 0 0 16px; font-size: 20px; line-height: 1.35; }
  .goalbox { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 8px 0; }
  .goalbox b { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--good); }
</style>
</head>

</div>
<header>

  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">

<div id="view"><div id="banner" hidden></div></div>
<div id="mapPane"><canvas id="map"></canvas></div>

{
  const arr = new Float32Array(480 * 3);

    arr[i * 3 + 1] = Math.sin(ph) * r;

}
{
  const rock = new THREE.DodecahedronGeometry(0.36, 0);

const map = $("map");
const ctx = map.getContext("2d");
const WORLD = 70;
function worldToMap(x, z, w, h) { return { px: (x / WORLD + 0.5) * w, py: (z / WORLD + 0.5) * h }; }
function blot(x, z, radius, color, w, h) {
  const p = worldToMap(x, z, w, h);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(p.px, p.py, (radius / WORLD) * w, (radius / WORLD) * h, 0, 0, Math.PI * 2);

}
function drawMap() {
  const w = map.clientWidth, h = map.clientHeight;
  if (w < 2 || h < 2) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if (map.width !== Math.floor(w * dpr) || map.height !== Math.floor(h * dpr)) {
    map.width = Math.floor(w * dpr); map.height = Math.floor(h * dpr);

  ctx.fillRect(0, 0, w, h);

    if (dust && !got.dust) blot(dust.x, dust.z, 3.2, "#6d6458", w, h);
  } else if (mode === "spectro") {
    const flick = 0.35 + Math.abs(Math.sin(performance.now() / 180)) * 0.55;
    for (const d of decoys) blot(d.x, d.z, 2.2, `rgba(200,107,255,${flick})`, w, h);
    if (mineral && !got.mineral) blot(mineral.x, mineral.z, 2.4, "#e7b6ff", w, h);
  } else if (mode === "thermal") {

  } else if (mode === "drill" && ice && !got.ice) {
    blot(ice.x, ice.z, 8, "rgba(183,255,242,0.25)", w, h);
    blot(ice.x, ice.z, 2.4, "#e8fffb", w, h);

map.addEventListener("pointerdown", (ev) => {

$("m-camera").onclick = () => setMode("camera");
$("m-spectro").onclick = () => setMode("spectro");

$("m-drill").onclick = () => setMode("drill");

function doAction() {

  const task = nextTask();
  if (task.label.startsWith("Follow")) {

$("restart").onclick = () => location.reload();

window.addEventListener("keydown", (e) => {
  if (!live) return;

  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key === "1") setMode("camera");
  if (e.key === "2") setMode("spectro");
  if (e.key === "3") setMode("thermal");
  if (e.key === "4") setMode("drill");
  if (e.key === " ") useTool();

});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

function syncView() {
  if (soilDisc) soilDisc.visible = mode === "camera" && !got.soil;
  if (dustDisc) dustDisc.visible = mode === "camera" && !got.dust;
  if (mineralDisc) mineralDisc.visible = mode === "spectro" && !got.mineral;
  decoyDiscs.forEach((d) => { d.visible = mode === "spectro"; d.material.opacity = 0.2 + Math.abs(Math.sin(performance.now() / 180)) * 0.45; });
  tempMasts.forEach((m, i) => { m.visible = mode === "thermal" && !got.temps[i]; });
  if (iceDisc) iceDisc.visible = mode === "drill" && !got.ice;
  if (iceCore) iceCore.visible = mode === "drill" && !got.ice;
