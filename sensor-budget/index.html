<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ping Budget — Moon Rover</title>
<style>
  :root {
    --bg: #070b14;
    --panel: #121a2b;
    --ink: #f4efe6;
    --dim: #b7ab9c;
    --line: #2a354c;
    --copper: #e39a4a;
    --ice: #79c7ff;
    --hazard: #ff6b7a;
    --pass: #8fd9a8;
    --gold: #f0c14a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    gap: 18px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: #0c1322;
  }
  header a { color: var(--dim); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--ink); }
  h1 { font-size: 16px; margin: 0; letter-spacing: 0.14em; font-weight: 650; }
  h1 span { color: var(--copper); }
  .sub { color: var(--dim); font-size: 13px; }
  .scorebox { margin-left: auto; min-width: 280px; }
  .score-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  #pct { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 700; }
  .meter { position: relative; height: 12px; background: #1c2638; border-radius: 99px; }
  .meter .fill { height: 100%; width: 0; border-radius: 99px; background: #8a7354; }
  .meter.pass .fill { background: var(--pass); }
  .meter.great .fill { background: linear-gradient(90deg, var(--pass), var(--gold)); }
  .tick { position: absolute; top: -3px; width: 2px; height: 18px; background: #fff; }
  .tick.gold { background: var(--gold); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.4fr 0.72fr; }
  #view { position: relative; min-height: 0; background: #05070e; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #banner {
    position: absolute; left: 16px; bottom: 16px;
    padding: 10px 14px; background: #10182acc; border: 1px solid var(--line);
    border-radius: 10px; font-weight: 700; letter-spacing: 0.04em;
  }
  #banner.pass { color: var(--pass); }
  #banner.great { color: var(--gold); }
  #banner.fail { color: var(--hazard); }
  aside {
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px; background: var(--panel); border-left: 1px solid var(--line); min-height: 0;
  }
  .modes, .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    background: #1a2438; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--copper); }
  button[aria-pressed="true"] { background: var(--copper); color: #1a1208; border-color: var(--copper); font-weight: 700; }
  button.ice[aria-pressed="true"] { background: var(--ice); color: #082033; border-color: var(--ice); }
  button.hazard[aria-pressed="true"] { background: var(--hazard); color: #2a0c12; border-color: var(--hazard); }
  button.route[aria-pressed="true"] { background: #f2d2a2; color: #2a2116; border-color: #f2d2a2; }
  button:disabled { opacity: 0.45; cursor: default; }
  #mapWrap { flex: 1; min-height: 200px; position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  #map { width: 100%; height: 100%; display: block; cursor: crosshair; background: #0c121c; }
  #status { margin: 0; min-height: 2.6em; color: var(--dim); }
  .how { margin: 0; color: var(--ink); background: #0c1320; border-radius: 8px; padding: 8px 10px; }
  .legend { display: flex; gap: 10px; font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  .boot-error { padding: 16px; color: var(--hazard); }
  .group-label { margin: 2px 0 0; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
  button.primary { background: var(--copper); color: #1a1208; border-color: var(--copper); font-weight: 750; }
  .brief { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; background: rgba(5, 8, 16, 0.68); }
  .brief[hidden] { display: none; }
  .brief-card { width: min(440px, 100%); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .brief-card .kicker { margin: 0 0 4px; letter-spacing: 0.16em; font-size: 12px; color: var(--dim); }
  .brief-card h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.06em; }
  .brief-card ol { margin: 0 0 16px; padding-left: 1.15em; }
  .brief-card li { margin: 8px 0; }
  .brief-card .primary { width: 100%; padding: 12px; }
  .brief-card p { margin: 0 0 16px; font-size: 20px; line-height: 1.35; }
  .goalbox { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .goalbox b { font-size: 22px; font-variant-numeric: tabular-nums; }
  #mapLabel.act { color: var(--copper); font-size: 15px; letter-spacing: 0.04em; font-weight: 750; text-transform: none; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
    .scorebox { min-width: 180px; }
  }
</style>
</head>
<body>
<div id="brief" class="brief" role="dialog" aria-labelledby="brief-title">
  <div class="brief-card">
    <p id="brief-title">Cache 4 mineral hills and 1 ice pocket before the pings run out.</p>
    <button id="begin" class="primary" type="button">Ping mineral</button>
  </div>
</div>
<header>
  <a href="../index.html">All versions</a>
  <div>
    <h1><span>PING</span> BUDGET</h1>
  </div>
  <div class="scorebox">
    <div class="score-row">
      <span id="pct">0%</span>
      <span>PASS 60 · STRONG 90</span>
    </div>
    <div class="meter" id="meter">
      <div class="fill" id="fill"></div>
      <i class="tick" style="left:60%"></i>
      <i class="tick gold" style="left:90%"></i>
    </div>
  </div>
</header>
<main>
  <div id="view"><div id="banner" hidden></div></div>
  <aside>
    <div class="goalbox"><span id="goal">Hills and ice</span><b id="count">0/5</b></div>
    <p class="group-label">Sensor</p>
    <div class="modes">
      <button id="m-mineral" aria-pressed="true">1 Mineral</button>
      <button id="m-ice" class="ice">2 Ice</button>
      <button id="m-hazard" class="hazard">3 Hazard</button>
      <button id="m-route" class="route">4 Route</button>
    </div>
    <p class="group-label act" id="mapLabel">Ping mineral</p>
    <div id="mapWrap"><canvas id="map"></canvas></div>
    <div class="legend">
      <span><i style="background:#e39a4a"></i>mineral</span>
      <span><i style="background:#79c7ff"></i>ice</span>
      <span><i style="background:#ff6b7a"></i>hazard</span>
      <span><i style="background:#f2d2a2"></i>route</span>
    </div>
    <button id="commit" class="primary" hidden>Send rover</button>
    <div class="row">
      <button id="undo">Undo</button>
      <button id="restart">Retry</button>
    </div>
  </aside>
</main>
<script type="module">
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js";
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (err) {
  document.body.insertAdjacentHTML("beforeend", '<p class="boot-error">Could not load Three.js r170 from the CDN.</p>');
  throw err;
}

const WORLD = 56;
const START = { x: -22, z: 20 };
const PING_R = 9;
const BUDGET_MAX = 8;
const WP_MAX = 8;
const $ = (id) => document.getElementById(id);
let live = false;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function normAng(d) {
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function makeRand(seed) {
  let a = seed >>> 0;
  return function rand() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeNoise(rand) {
  const perm = new Uint8Array(256);
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const tmp = perm[i]; perm[i] = perm[j]; perm[j] = tmp;
  }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, z) => {
    const hh = h & 3;
    const u = hh < 2 ? x : z;
    const v = hh < 2 ? z : x;
    return ((hh & 1) ? -u : u) + ((hh & 2) ? -v : v);
  };
  return function noise(x, z) {
    const X = Math.floor(x) & 255;
    const Z = Math.floor(z) & 255;
    const xf = x - Math.floor(x);
    const zf = z - Math.floor(z);
    const u = fade(xf);
    const v = fade(zf);
    const aa = p[p[X] + Z];
    const ab = p[p[X] + Z + 1];
    const ba = p[p[X + 1] + Z];
    const bb = p[p[X + 1] + Z + 1];
    return lerp(
      lerp(grad(aa, xf, zf), grad(ba, xf - 1, zf), u),
      lerp(grad(ab, xf, zf - 1), grad(bb, xf - 1, zf - 1), u),
      v
    );
  };
}

const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
const rand = makeRand(seed);
const noise = makeNoise(rand);
const fbm = (x, z) => noise(x, z) * 0.65 + noise(x * 2.2 + 4, z * 2.2 - 3) * 0.35;

function place() {
  const spots = [];
  function push(kind, extra) {
    for (let guard = 0; guard < 500; guard++) {
      const x = -23 + rand() * 46;
      const z = -23 + rand() * 46;
      if (Math.hypot(x - START.x, z - START.z) < 11) continue;
      if (spots.some((s) => Math.hypot(s.x - x, s.z - z) < 9.2)) continue;
      const spot = { kind, x, z, ...extra };
      spots.push(spot);
      return spot;
    }
    return null;
  }
  const hills = [];
  for (let i = 0; i < 5; i++) {
    const h = push("hill", { amp: 1.7 + rand() * 0.8, r: 3.3 + rand() * 1.1, mineral: i < 4 });
    if (h) hills.push(h);
  }
  const craters = [];
  for (let i = 0; i < 4; i++) {
    const c = push("crater", { r: 3.6 + rand() * 1.5, depth: 1.35 + rand() * 0.7, ice: i < 3 });
    if (c) craters.push(c);
  }
  const minerals = hills.filter((h) => h.mineral).map((h) => ({ x: h.x, z: h.z, got: false }));
  const ices = craters.filter((c) => c.ice).map((c) => ({ x: c.x, z: c.z, got: false }));
  const hazards = [];
  const hosts = [...minerals, ...ices];
  for (let i = 0; i < 6 && hosts.length; i++) {
    const host = hosts[Math.floor(rand() * hosts.length)];
    const ang = rand() * Math.PI * 2;
    const d = 3.6 + rand() * 2.6;
    hazards.push({ x: host.x + Math.cos(ang) * d, z: host.z + Math.sin(ang) * d, hit: false, known: false });
  }
  return { hills, craters, minerals, ices, hazards };
}

const world = place();
const hills = world.hills;
const craters = world.craters;
const minerals = world.minerals;
const ices = world.ices;
const hazards = world.hazards;
{
  const yaw0 = Math.atan2(-START.x, -START.z);
  if (hills[0] && hills[0].mineral && minerals[0]) {
    hills[0].x = START.x + Math.sin(yaw0) * 15;
    hills[0].z = START.z + Math.cos(yaw0) * 15;
    hills[0].amp = 2.25;
    minerals[0].x = hills[0].x;
    minerals[0].z = hills[0].z;
  }
}

function heightAt(x, z) {
  let h = fbm(x * 0.075, z * 0.075) * 0.55;
  for (const hill of hills) {
    const d2 = (x - hill.x) ** 2 + (z - hill.z) ** 2;
    h += Math.exp(-d2 / (2 * hill.r * hill.r)) * hill.amp;
  }
  for (const c of craters) {
    const d = Math.hypot(x - c.x, z - c.z);
    const u = d / c.r;
    if (u < 1.2) {
      const rim = Math.exp(-((u - 0.82) ** 2) / 0.02) * 0.28;
      const cup = u < 1 ? (1 - u * u) : 0;
      h += rim * c.depth - cup * c.depth;
    }
  }
  h += fbm(x * 0.55, z * 0.55) * 0.07;
  return h;
}

const pings = [];
let budget = BUDGET_MAX;
const wps = [];
let mode = "mineral";
let phase = "plan";
let wpIndex = 0;
let stall = 0;
let bestDist = Infinity;
const rover = { x: START.x, z: START.z, yaw: Math.atan2(-START.x, -START.z), stun: 0, speed: 0 };
const flags = [];

function completion() {
  const mg = minerals.filter((m) => m.got).length;
  const ig = ices.filter((m) => m.got).length;
  const hits = hazards.filter((h) => h.hit).length;
  let s = mg * 12 + ig * 16 - hits * 6;
  if (hits === 0 && mg + ig >= 5) s += 4;
  if (mg >= 4 && ig >= 1) s = Math.max(s, 64);
  return clamp(Math.round(s), 0, 100);
}

function say() {}
let saw60 = false, saw90 = false;
let iceGoal = false;
function flash(text, cls) {
  const b = $("banner");
  b.hidden = false;
  b.className = cls || "";
  b.textContent = text;
}
function hotPing(modeName) {
  const list = modeName === "mineral" ? minerals : ices;
  return list.some((t) => !t.got && pings.some((p) => p.mode === modeName && p.cells.some((c) => c.signal >= 0.35 && Math.hypot(c.x - t.x, c.z - t.z) <= 4)));
}
function canReach() {
  if (completion() >= 90) return false;
  const kind = completion() >= 60 || minerals.filter((m) => m.got).length >= 4 ? "ice" : "mineral";
  return budget > 0 || hotPing(kind);
}
function cacheFull() {
  return minerals.filter((m) => m.got).length >= 4 && ices.filter((m) => m.got).length >= 1;
}
function passIsUp() {
  const b = $("banner");
  return !!b && !b.hidden && b.textContent === "Pass";
}
function planAction() {
  const s = completion();
  const mg = minerals.filter((m) => m.got).length;
  const holdPass = cacheFull() && !iceGoal;
  if (phase === "done" || (s >= 90 && !holdPass)) return { label: "Retry", where: "button" };
  if (phase === "drive") return { label: "Rolling", where: "button", disabled: true };
  if (wps.length) return { label: "Send rover", where: "button" };
  const kind = s >= 60 || mg >= 4 ? "ice" : "mineral";
  const verb = kind === "ice" ? "Ping ice" : "Ping mineral";
  if (budget <= 0 && !hotPing(kind)) return { label: "Retry", where: "button" };
  if (hotPing(kind)) return mode === "route" ? { label: "Mark route", where: "map" } : { label: "Mark route", where: "button" };
  return mode === kind ? { label: verb, where: "map" } : { label: verb, where: "button" };
}
function paintGoal() {
  const mg = minerals.filter((m) => m.got).length;
  const ig = ices.filter((m) => m.got).length;
  const s = completion();
  const passHave = mg + Math.min(ig, 1);
  const full = mg >= 4 && ig >= 1;
  if (!iceGoal && full) {
    if (!passIsUp()) flash("Pass", "pass");
    saw60 = true;
  } else if (!saw90 && iceGoal && s >= 90) {
    saw90 = true;
    flash("Strong", "great");
  }
  if (!iceGoal) {
    $("goal").textContent = "Hills and ice";
    $("count").textContent = Math.min(passHave, 5) + "/5";
  } else {
    $("goal").textContent = "Ice pockets";
    $("count").textContent = Math.min(Math.max(ig - 1, 0), 2) + "/2";
  }
  const act = planAction();
  if (act.label === "Retry" && phase === "plan" && s < 60) {
    phase = "done";
    flash(mg < 4 ? "Missed a mineral hill." : "Missed the ice pocket.", "fail");
  }
  const btn = $("commit");
  btn.hidden = act.where === "map";
  btn.disabled = !!act.disabled;
  btn.textContent = act.label;
  $("restart").hidden = true;
  const mapLabel = $("mapLabel");
  mapLabel.textContent = act.where === "map" ? act.label : "Route";
  mapLabel.className = "group-label" + (act.where === "map" ? " act" : "");
}
function paintScore() {
  const s = completion();
  $("pct").textContent = s + "%";
  $("fill").style.width = s + "%";
  $("meter").className = "meter" + (s >= 90 ? " great" : s >= 60 ? " pass" : "");
  paintGoal();
}

function recomputeKnown() {
  for (const h of hazards) {
    h.known = pings.some((p) => p.mode === "hazard" && Math.hypot(p.x - h.x, p.z - h.z) <= PING_R);
  }
}

const scene = new THREE.Scene();
let groundMesh = null;
scene.background = new THREE.Color(0x070a12);
scene.fog = new THREE.FogExp2(0x070a12, 0.012);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 240);
const viewEl = $("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
viewEl.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb7c4d6, 0x4a4036, 0.32));
const sun = new THREE.DirectionalLight(0xffe0b0, 4.4);
sun.position.set(68, 15, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -36;
sun.shadow.camera.right = 36;
sun.shadow.camera.top = 36;
sun.shadow.camera.bottom = -36;
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 150;
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.028;
scene.add(sun);
scene.add(sun.target);
const fill = new THREE.DirectionalLight(0x7f93ad, 0.16);
fill.position.set(-36, 8, -20);
scene.add(fill);

function addStars() {
  const arr = new Float32Array(700 * 3);
  for (let i = 0; i < 700; i++) {
    const th = rand() * Math.PI * 2;
    const ph = 0.2 + rand() * 1.2;
    const r = 150;
    arr[i * 3] = Math.cos(th) * Math.cos(ph) * r;
    arr[i * 3 + 1] = Math.sin(ph) * r;
    arr[i * 3 + 2] = Math.sin(th) * Math.cos(ph) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xf7f1e4, size: 0.42, sizeAttenuation: true, transparent: true, opacity: 0.8 })));
}
addStars();
const motes = [];
{
  const geo = new THREE.SphereGeometry(0.03, 4, 3);
  const mat = new THREE.MeshBasicMaterial({ color: 0xd9cbb6, transparent: true, opacity: 0.28 });
  for (let i = 0; i < 48; i++) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set((rand() - 0.5) * 48, 0.25 + rand() * 1.6, (rand() - 0.5) * 48);
    m.userData.s = 0.35 + rand() * 0.9;
    scene.add(m);
    motes.push(m);
  }
}

function buildTerrain() {
  const segs = 96;
  const geo = new THREE.PlaneGeometry(WORLD, WORLD, segs, segs);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const low = new THREE.Color(0x3c4450);
  const mid = new THREE.Color(0x7a7368);
  const high = new THREE.Color(0xc4b7a4);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const h = heightAt(x, z);
    pos.setY(i, h);
    const t = clamp(h / 2.4 + 0.38, 0, 1);
    const col = t < 0.5 ? low.clone().lerp(mid, t * 2) : mid.clone().lerp(high, (t - 0.5) * 2);
    const n = (fbm(x * 0.9, z * 0.9) + 1) * 0.5;
    col.offsetHSL((n - 0.5) * 0.02, 0, (n - 0.5) * 0.14);
    if (h < -0.2) col.multiplyScalar(0.78);
    for (const hill of hills) {
      const d = Math.hypot(x - hill.x, z - hill.z);
      if (d < hill.r * 0.85 && h > 0.6) col.lerp(new THREE.Color(0xb08968), 0.35);
    }
    for (const c of craters) {
      const d = Math.hypot(x - c.x, z - c.z);
      if (d < c.r * 0.62) col.lerp(new THREE.Color(0xd5e4ef), 0.5);
    }
    colors[i * 3] = col.r;
    colors[i * 3 + 1] = col.g;
    colors[i * 3 + 2] = col.b;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, metalness: 0.02 }));
  mesh.receiveShadow = true;
  groundMesh = mesh;
  scene.add(mesh);
}
buildTerrain();

function scatterRocks() {
  const geos = [new THREE.DodecahedronGeometry(0.42, 0), new THREE.IcosahedronGeometry(0.34, 0)];
  const mat = new THREE.MeshStandardMaterial({ color: 0x8d867c, roughness: 0.94, metalness: 0.02 });
  for (let i = 0; i < 46; i++) {

    camY = Math.max(y + 8.2, heightAt(camX, camZ) + 2.2);
    lookX = rover.x + Math.sin(rover.yaw) * 3;
    lookY = y + 0.7;
    lookZ = rover.z + Math.cos(rover.yaw) * 3;
  }
  look.lerp(new THREE.Vector3(lookX, lookY, lookZ), k);
  camPos.lerp(new THREE.Vector3(camX, camY, camZ), k);
  camera.position.copy(camPos);
  camera.lookAt(look);
  sun.target.position.set(rover.x, y, rover.z);
  for (const m of motes) {
    m.position.x += m.userData.s * dt;
    if (m.position.x > 26) m.position.x = -26;
  }
  const w = viewEl.clientWidth;
  const h = viewEl.clientHeight;
  if (w > 0 && h > 0 && (renderer.domElement.width !== Math.floor(w * renderer.getPixelRatio()) || camera.aspect !== w / h)) {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  renderer.render(scene, camera);
  drawMap();
  paintScore();
  requestAnimationFrame(frame);
}
paintScore();
requestAnimationFrame(frame);

window.ROVER = {
  completion,
  ping: (m, x, z) => { setMode(m); addPing(x, z); },
  waypoint: (x, z) => { setMode("route"); addWaypoint(x, z); },
  commit,
  minerals, ices, hazards, rover, wps,
  get phase() { return phase; },
  get budget() { return budget; }
};
</script>
